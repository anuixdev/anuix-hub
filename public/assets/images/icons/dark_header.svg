<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente ámbar táctico para el chevron '>' -->
    <linearGradient id="promptAmber" x1="17" y1="21" x2="30" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Fondo de terminal oscura -->
    <linearGradient id="terminalBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12131c" />
      <stop offset="100%" stop-color="#08080b" />
    </linearGradient>
  </defs>

  <style>
    @media (prefers-color-scheme: light) {
      .term-chassis { fill: #ffffff; stroke: rgba(234, 88, 12, 0.35); }
      .term-chevron { stroke: #ea580c; }
      .term-cursor { stroke: #09090e; }
    }
  </style>

  <!-- Chasis exterior de la consola -->
  <rect class="term-chassis" x="3.5" y="3.5" width="57" height="57" rx="14" fill="url(#terminalBg)" stroke="#fbbf24" stroke-width="2.2" stroke-opacity="0.35" />

  <!-- Prompt: Flecha '>' centrada -->
  <path class="term-chevron" d="M17 21 L29 32 L17 43" stroke="url(#promptAmber)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cursor: Guion bajo '_' alineado a la base -->
  <path class="term-cursor" d="M36 43 H47" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
</svg>
